<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F26B3A">
<meta name="description" content="자취 요리 레시피, 자취템 체크리스트, 장보기 예산을 한 번에">
<title>자취 메이트</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>자취 메이트</h1>
    <button class="icon-btn" data-act="settings" aria-label="설정">⚙️</button>
  </header>
  <div id="timer" class="timer" hidden></div>
  <main id="view" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="메인 메뉴">
    <button data-tab="home"><span>🏠</span>홈</button>
    <button data-tab="recipes"><span>🍳</span>요리</button>
    <button data-tab="items"><span>🛒</span>자취템</button>
    <button data-tab="shop"><span>📋</span>장보기</button>
    <button data-tab="tips"><span>💡</span>꿀팁</button>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-head"><button class="icon-btn" data-act="close-sheet" aria-label="닫기">←</button><h2 id="sheet-title"></h2></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="data/recipes.js"></script>
<script src="data/items.js"></script>
<script src="data/tips.js"></script>
<script src="js/app.js"></script>
</body>
</html>
